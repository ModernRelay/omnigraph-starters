  deal-fund: { server: local, graph: vcos, query: deal_fund, args: [slug] }
  deal-lead-partner: { server: local, graph: vcos, query: deal_lead_partner, args: [slug] }
  deal-thesis: { server: local, graph: vcos, query: deal_thesis, args: [slug] }
  deal-market: { server: local, graph: vcos, query: deal_market, args: [slug] }
  deal-lead-investor: { server: local, graph: vcos, query: deal_lead_investor, args: [slug] }
  deal-participants: { server: local, graph: vcos, query: deal_participants, args: [slug] }
