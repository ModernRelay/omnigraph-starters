# Operator-config example for the VC OS cookbook (RFC-007/008).
# Your operator config lives at ~/.omnigraph/config.yaml (per-user, NOT committed).
# Merge the `aliases:` below into it for short names over this graph's stored
# queries. Point `local` at your running cluster server (`omnigraph-server
# --cluster .`); alias invocation needs the server up.
servers:
  local:
    url: http://127.0.0.1:8080
defaults:
  server: local
  default_graph: vcos
aliases:
  # ══════════════════════════════════════════════════════════════════
  # VIEW: IC Meeting
  # ══════════════════════════════════════════════════════════════════
  # All pre-ic-brief-* aliases take a *Deal* slug (not an Organization slug).
  # Example: omnigraph alias pre-ic-brief-organization deal-helix-series-a
  pre-ic-brief-organization: { server: local, graph: vcos, query: pre_ic_brief_organization, args: [slug] }
  pre-ic-brief-thesis: { server: local, graph: vcos, query: pre_ic_brief_thesis, args: [slug] }
  pre-ic-brief-evidence: { server: local, graph: vcos, query: pre_ic_brief_evidence, args: [slug] }
  pre-ic-brief-questions: { server: local, graph: vcos, query: pre_ic_brief_questions, args: [slug] }
  pre-ic-brief-debate: { server: local, graph: vcos, query: pre_ic_brief_debate, args: [slug] }
  pre-ic-meeting-history: { server: local, graph: vcos, query: ic_prep_meeting_history, args: [slug] }
  pre-ic-open-commitments: { server: local, graph: vcos, query: ic_prep_open_commitments, args: [slug] }
  debate-stances: { server: local, graph: vcos, query: debate_stances, args: [slug] }
  founder-card: { server: local, graph: vcos, query: get_person, args: [slug], format: kv }
  person-insights: { server: local, graph: vcos, query: person_insights, args: [slug] }

  # ══════════════════════════════════════════════════════════════════
  # VIEW: Weekly Pipeline Meeting
  # ══════════════════════════════════════════════════════════════════
  deals-open: { server: local, graph: vcos, query: deals_open }
  pipeline-organizations: { server: local, graph: vcos, query: pipeline_organizations }
  high-fit-pipeline: { server: local, graph: vcos, query: high_fit_pipeline }
  observed-organizations: { server: local, graph: vcos, query: observed_organizations }
  recent-signals: { server: local, graph: vcos, query: recent_signals }
  recent-contradictions: { server: local, graph: vcos, query: recent_contradictions }
  open-questions: { server: local, graph: vcos, query: open_questions }

  # ══════════════════════════════════════════════════════════════════
  # VIEW: Portfolio Support Meeting
  # ══════════════════════════════════════════════════════════════════
  portfolio-book: { server: local, graph: vcos, query: portfolio_book }
  portfolio-organizations: { server: local, graph: vcos, query: portfolio_organizations }
  portfolio-recent-signals: { server: local, graph: vcos, query: portfolio_recent_signals }
  portfolio-updates-recent: { server: local, graph: vcos, query: portfolio_updates_recent }
  portfolio-open-questions: { server: local, graph: vcos, query: portfolio_open_questions }
  portfolio-open-commitments: { server: local, graph: vcos, query: portfolio_open_commitments }
  board-prep-pack: { server: local, graph: vcos, query: board_prep_pack, args: [slug] }
  board-prep-open-questions: { server: local, graph: vcos, query: board_prep_open_questions, args: [slug] }
  board-prep-commitments: { server: local, graph: vcos, query: board_prep_commitments, args: [slug] }
  board-prep-meeting-history: { server: local, graph: vcos, query: board_meetings_for_organization, args: [slug] }
  board-prep-next-meeting: { server: local, graph: vcos, query: upcoming_board_meetings_for_organization, args: [slug] }
  signal-portfolio-impact: { server: local, graph: vcos, query: signal_portfolio_impact, args: [slug] }
  # Broader than portfolio: any engaged org (pipeline, evaluating, in-diligence, ic-ready, watching, portfolio).
  signal-engagement-impact: { server: local, graph: vcos, query: signal_engagement_impact, args: [slug] }
  exit-landscape: { server: local, graph: vcos, query: exit_landscape, args: [slug] }
  exit-landscape-decision-makers: { server: local, graph: vcos, query: exit_landscape_decision_makers, args: [slug] }
  contradicted-active-theses: { server: local, graph: vcos, query: contradicted_active_theses }
  co-investor-leads: { server: local, graph: vcos, query: co_investor_leads }
  co-investor-participants: { server: local, graph: vcos, query: co_investor_participants }
  # `organization-co-investors` was renamed to make the lead/participant split honest.
  # Callers wanting the full co-investor view should union both reads.
  organization-co-investor-leads: { server: local, graph: vcos, query: organization_co_investor_leads, args: [slug] }
  organization-co-investor-participants: { server: local, graph: vcos, query: organization_co_investor_participants, args: [slug] }
