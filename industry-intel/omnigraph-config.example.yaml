# Operator-config example for the Industry Intel (SPIKE) cookbook.
# Your operator config lives at ~/.omnigraph/config.yaml (per-user, NOT committed).
# Merge the `aliases:` below into it for short names over this graph's stored
# queries. Point `local` at your running cluster server (`omnigraph-server
# --cluster .`); alias invocation needs the server up.
servers:
  local:
    url: http://127.0.0.1:8080
defaults:
  server: local
  default_graph: spike
aliases:
  # Signals
  signal: { server: local, graph: spike, query: get_signal, args: [slug], format: kv }
  signals: { server: local, graph: spike, query: recent_signals }
  signal-patterns: { server: local, graph: spike, query: signal_patterns, args: [slug] }
  signal-elements: { server: local, graph: spike, query: signal_elements, args: [slug] }

  # Patterns
  pattern: { server: local, graph: spike, query: get_pattern, args: [slug], format: kv }
  patterns: { server: local, graph: spike, query: patterns_by_kind, args: [kind] }
  pattern-signals: { server: local, graph: spike, query: pattern_signals, args: [slug] }
  pattern-elements: { server: local, graph: spike, query: pattern_elements, args: [slug] }

  # Elements
  element: { server: local, graph: spike, query: get_element, args: [slug], format: kv }
  elements: { server: local, graph: spike, query: elements_by_kind, args: [kind] }
  element-signals: { server: local, graph: spike, query: element_signals, args: [slug] }
  element-patterns: { server: local, graph: spike, query: element_patterns, args: [slug] }

  # Insights
  insight: { server: local, graph: spike, query: get_insight, args: [slug], format: kv }
  insight-patterns: { server: local, graph: spike, query: insight_patterns, args: [slug] }
  insight-elements: { server: local, graph: spike, query: insight_elements, args: [slug] }

  # KnowHow
  knowhow: { server: local, graph: spike, query: get_knowhow, args: [slug], format: kv }
  knowhows: { server: local, graph: spike, query: recent_knowhow }
  knowhow-elements: { server: local, graph: spike, query: knowhow_elements, args: [slug] }

  # Mutations: SPIKE nodes
  add-signal: { server: local, graph: spike, query: add_signal, args: [slug, name, brief, stagingTimestamp, createdAt, updatedAt] }
  add-element: { server: local, graph: spike, query: add_element, args: [slug, name, kind, createdAt, updatedAt] }
  add-pattern: { server: local, graph: spike, query: add_pattern, args: [slug, name, kind, createdAt, updatedAt] }
  add-insight: { server: local, graph: spike, query: add_insight, args: [slug, name, createdAt, updatedAt] }
  add-knowhow: { server: local, graph: spike, query: add_knowhow, args: [slug, name, stagingTimestamp, createdAt, updatedAt] }

  # Mutations: Supportive nodes
  add-company: { server: local, graph: spike, query: add_company, args: [slug, name] }
  add-source: { server: local, graph: spike, query: add_source, args: [slug, name] }
  add-expert: { server: local, graph: spike, query: add_expert, args: [slug, name] }
  add-artifact: { server: local, graph: spike, query: add_artifact, args: [slug, name, artifactType, stagingTimestamp, createdAt, updatedAt] }

  # Mutations: Core analytical edges
  link-forms-pattern: { server: local, graph: spike, query: link_signal_forms_pattern, args: [signal, pattern] }
  link-contradicts-pattern: { server: local, graph: spike, query: link_signal_contradicts_pattern, args: [signal, pattern] }
  link-highlights-pattern: { server: local, graph: spike, query: link_insight_highlights_pattern, args: [insight, pattern] }
  link-relies-on-element: { server: local, graph: spike, query: link_insight_relies_on_element, args: [insight, element] }

  # Mutations: Signal → Element
  link-on-element: { server: local, graph: spike, query: link_signal_on_element, args: [signal, element] }

  # Mutations: Element edges
  link-enables-element: { server: local, graph: spike, query: link_element_enables, args: [from, to] }
  link-uses-element: { server: local, graph: spike, query: link_element_uses, args: [from, to] }
  link-exemplifies-pattern: { server: local, graph: spike, query: link_element_exemplifies_pattern, args: [element, pattern] }
  link-enables-pattern: { server: local, graph: spike, query: link_element_enables_pattern, args: [element, pattern] }

  # Mutations: Development & affiliation
  link-developed-by: { server: local, graph: spike, query: link_element_developed_by, args: [element, company] }
  link-affiliated-with: { server: local, graph: spike, query: link_expert_affiliated_with, args: [expert, company] }

  # Mutations: Classification
  link-relevant-company: { server: local, graph: spike, query: link_signal_relevant_company, args: [signal, company] }

  # Mutations: Provenance — artifacts + sources
  link-published-by: { server: local, graph: spike, query: link_artifact_published_by, args: [artifact, source] }
  link-contributed-by: { server: local, graph: spike, query: link_artifact_contributed_by, args: [artifact, expert] }
  link-spotted-in: { server: local, graph: spike, query: link_signal_spotted_in, args: [signal, artifact] }
  link-identified-in: { server: local, graph: spike, query: link_element_identified_in, args: [element, artifact] }
  link-knowhow-sourced-from: { server: local, graph: spike, query: link_knowhow_sourced_from, args: [knowhow, artifact] }
  link-signal-sourced-from: { server: local, graph: spike, query: link_signal_sourced_from, args: [signal, source] }

  # Mutations: KnowHow references
  link-references-element: { server: local, graph: spike, query: link_knowhow_references, args: [knowhow, element] }

  # ── Weekly review (operating loop — see README) ──
  triage: { server: local, graph: spike, query: orphan_signals }
  momentum: { server: local, graph: spike, query: pattern_momentum, args: [since] }
  stale: { server: local, graph: spike, query: stale_patterns, args: [since] }
  contested: { server: local, graph: spike, query: contested_patterns }
  unsourced: { server: local, graph: spike, query: unsourced_signals }

  # ── Hybrid retrieval (requires embeddings — see README) ──
  related: { server: local, graph: spike, query: related_chunks, args: [q] }
  hybrid-search: { server: local, graph: spike, query: hybrid_chunks, args: [q] }
