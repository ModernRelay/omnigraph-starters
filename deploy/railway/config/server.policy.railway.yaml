# Cluster-bound policy for the Railway template (applies_to: [cluster]).
# Server-level gate: only admins may enumerate the deployment's graphs
# (GET /graphs). Injected by init.sh alongside policy.railway.yaml for
# cookbooks that do not ship their own server bundle.
version: 1
groups:
  admins: ["act-admin"]
rules:
  - id: admin-graph-list
    allow:
      actors: { group: admins }
      actions: [graph_list]
