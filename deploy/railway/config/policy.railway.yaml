# Graph-bound Cedar policy for the Railway template (0.10 cluster bundle).
#
# Injected by init.sh into the assembled cluster config for cookbooks that do
# not declare their own `policies:` (industry-intel ships its own bundle but
# accepts the same generated actors — see the README's Authorization model).
#
# Three actors are pre-wired to the three bearer tokens the Railway template
# generates, mapped through OMNIGRAPH_SERVER_BEARER_TOKENS_JSON:
#
#   act-admin  → admin token  → all actions on every branch
#   act-writer → writer token → read/export/change + stored-query invocation
#                               anywhere, branch_create on unprotected branches
#   act-reader → reader token → read/export + stored read queries only
#
# `main` is protected — writers cannot target it with branch_create, and only
# admins may run schema_apply / branch_delete / branch_merge. The
# cluster validates policy bundles strictly: unknown fields are errors and one
# bundle owns each scope, so customizations belong in this file (re-applied by
# `cluster apply`), not in server flags.

version: 1

groups:
  admins: ["act-admin"]
  writers: ["act-admin", "act-writer"]
  readers: ["act-admin", "act-writer", "act-reader"]

protected_branches: [main]

rules:
  - id: readers-invoke-stored-queries
    allow:
      actors: { group: readers }
      actions: [invoke_query]

  - id: readers-read-any-branch
    allow:
      actors: { group: readers }
      actions: [read, export]
      branch_scope: any

  - id: writers-change-any-branch
    allow:
      actors: { group: writers }
      actions: [change]
      branch_scope: any

  - id: writers-branch-unprotected
    allow:
      actors: { group: writers }
      actions: [branch_create]
      target_branch_scope: unprotected

  - id: admins-structural-any-branch
    allow:
      actors: { group: admins }
      actions: [schema_apply, branch_create, branch_delete, branch_merge]
      target_branch_scope: any
