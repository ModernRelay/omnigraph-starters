# Railway config-as-code for omnigraph cookbook deploys.
# https://docs.railway.com/config-as-code/reference

[build]
builder        = "DOCKERFILE"
dockerfilePath = "deploy/railway/Dockerfile"

[deploy]
# Cluster-only boot (OmniGraph 0.10, RFC-011): the server's single boot
# source is `--cluster`, here the Bucket storage root itself — config-free
# serving of the state that preDeploy's `cluster apply` converged. Bearer
# tokens arrive via OMNIGRAPH_SERVER_BEARER_TOKENS_JSON; policy is applied
# cluster state, not a server flag.
#
# `exec` is load-bearing: a Dockerfile/image start command is run in exec
# form, so the shell wrapper (needed for $PORT expansion) becomes PID 1.
# Without `exec`, that shell — not omnigraph-server — receives Railway's
# SIGTERM on redeploy/teardown, so the server never drains and gets
# SIGKILLed. Railway's own docs use `/bin/sh -c "exec ..."` for this.
startCommand = "sh -c 'exec omnigraph-server --cluster \"$OMNIGRAPH_CLUSTER_URI\" --bind \"0.0.0.0:$PORT\"'"

# Runs between build and start. Assembles the bundled cookbook's cluster
# config, points storage at $OMNIGRAPH_CLUSTER_URI, and runs the idempotent
# validate → import → apply sequence — re-deploys converge to a no-op and
# never touch existing graph data.
preDeployCommand = ["/usr/local/bin/omnigraph-railway-init.sh"]

healthcheckPath         = "/healthz"
healthcheckTimeout      = 300
restartPolicyType       = "ON_FAILURE"
restartPolicyMaxRetries = 5

# REGION (critical): this service must run in the SAME Railway region as the
# Bucket. omnigraph-server makes many sequential S3 calls per operation, so a
# cross-region service↔Bucket hop is brutal — a single write measured ~46s
# cross-region vs ~3.3s in-region. This file deliberately does NOT pin a
# region (the Bucket's region is chosen at deploy time, and hardcoding one
# would force every deploy there): set the service region to match the Bucket
# in the Railway dashboard (Settings → Region), or add a
# `[deploy.multiRegionConfig.<region-id>]` block. See deploy/railway/README.md
# → "Service region" for the Bucket-code ↔ service-region-id mapping.
