# Operator-config example for the Second Brain cookbook (RFC-007/008).
# Your operator config lives at ~/.omnigraph/config.yaml (per-user, NOT committed).
# Merge the `aliases:` below into it for short names over this graph's stored
# queries. Point `local` at your running cluster server (`omnigraph-server
# --cluster .`); alias invocation needs the server up.
servers:
  local:
    url: http://127.0.0.1:8080
defaults:
  server: local
  default_graph: brain
aliases:
  # ── People & Relationships ──
  person: { server: local, graph: brain, query: get_person, args: [slug], format: kv }
  people: { server: local, graph: brain, query: people_all }
  people-by-relation: { server: local, graph: brain, query: people_by_relation, args: [relation] }
  close-friends: { server: local, graph: brain, query: close_friends }
  family: { server: local, graph: brain, query: family_members }
  person-knows: { server: local, graph: brain, query: person_knows, args: [slug] }
  person-family: { server: local, graph: brain, query: person_family, args: [slug] }
  person-lives-in: { server: local, graph: brain, query: person_lives_in, args: [slug] }
  person-works-at: { server: local, graph: brain, query: person_works_at, args: [slug] }
  person-recent-events: { server: local, graph: brain, query: person_recent_events, args: [slug] }
  person-artifacts-mentioning: { server: local, graph: brain, query: person_artifacts_mentioning, args: [slug] }
  person-artifacts-from: { server: local, graph: brain, query: person_artifacts_from, args: [slug] }
  person-tasks-i-owe: { server: local, graph: brain, query: person_tasks_i_owe, args: [slug] }
  person-tasks-they-owe: { server: local, graph: brain, query: person_tasks_they_owe, args: [slug] }
  person-notes: { server: local, graph: brain, query: person_notes, args: [slug] }
  person-recommendations: { server: local, graph: brain, query: person_recommended_media, args: [slug] }

  # ── Events ──
  event: { server: local, graph: brain, query: get_event, args: [slug], format: kv }
  events-recent: { server: local, graph: brain, query: events_recent }
  events-chronological: { server: local, graph: brain, query: events_chronological }
  events-by-kind: { server: local, graph: brain, query: events_by_kind, args: [kind] }
  event-attendees: { server: local, graph: brain, query: event_attendees, args: [slug] }
  event-place: { server: local, graph: brain, query: event_place, args: [slug] }
  event-project: { server: local, graph: brain, query: event_project, args: [slug] }
  person-life-events: { server: local, graph: brain, query: person_life_events, args: [slug] }

  # ── Notes ──
  note: { server: local, graph: brain, query: get_note, args: [slug], format: kv }
  notes-recent: { server: local, graph: brain, query: notes_recent }
  notes-by-kind: { server: local, graph: brain, query: notes_by_kind, args: [kind] }
  note-related: { server: local, graph: brain, query: note_related, args: [slug] }
  preferences-for-person: { server: local, graph: brain, query: preferences_for_person, args: [slug] }
  principles: { server: local, graph: brain, query: principles_all }
  open-questions: { server: local, graph: brain, query: open_questions }

  # ── Tasks ──
  task: { server: local, graph: brain, query: get_task, args: [slug], format: kv }
  tasks-next: { server: local, graph: brain, query: tasks_next }
  tasks-inbox: { server: local, graph: brain, query: tasks_inbox }
  tasks-waiting: { server: local, graph: brain, query: tasks_waiting }
  tasks-waiting-on-person: { server: local, graph: brain, query: tasks_waiting_on_person, args: [slug] }
  tasks-someday: { server: local, graph: brain, query: tasks_someday }
  tasks-by-context: { server: local, graph: brain, query: tasks_by_context, args: [context] }
  tasks-i-owe: { server: local, graph: brain, query: tasks_i_owe }
  tasks-they-owe: { server: local, graph: brain, query: tasks_they_owe }

  # ── Projects, Areas, Goals, Habits ──
  project: { server: local, graph: brain, query: get_project, args: [slug], format: kv }
  projects-active: { server: local, graph: brain, query: projects_active }
  projects-exploring: { server: local, graph: brain, query: projects_exploring }
  project-tasks: { server: local, graph: brain, query: project_tasks, args: [slug] }
  project-events: { server: local, graph: brain, query: project_events, args: [slug] }
  project-people: { server: local, graph: brain, query: project_people, args: [slug] }
  project-notes: { server: local, graph: brain, query: project_notes, args: [slug] }
  area: { server: local, graph: brain, query: get_area, args: [slug], format: kv }
  areas: { server: local, graph: brain, query: areas_all }
  areas-active: { server: local, graph: brain, query: areas_active }
  area-projects: { server: local, graph: brain, query: area_projects, args: [slug] }
  area-goals: { server: local, graph: brain, query: area_goals, args: [slug] }
  area-habits: { server: local, graph: brain, query: area_habits, args: [slug] }
  area-tasks: { server: local, graph: brain, query: area_tasks, args: [slug] }
  goal: { server: local, graph: brain, query: get_goal, args: [slug], format: kv }
  goals-active: { server: local, graph: brain, query: goals_active }
  goal-tasks: { server: local, graph: brain, query: goal_tasks, args: [slug] }
  habits-active: { server: local, graph: brain, query: habits_active }
  habit-principle: { server: local, graph: brain, query: habit_principle, args: [slug] }

  # ── Media ──
  media: { server: local, graph: brain, query: get_media, args: [slug], format: kv }
  reading-queue: { server: local, graph: brain, query: reading_queue }
  finished-books: { server: local, graph: brain, query: finished_books }
  media-recommended-by: { server: local, graph: brain, query: media_recommended_by, args: [slug] }
  media-authored-by: { server: local, graph: brain, query: media_authored_by, args: [slug] }

  # ── Artifacts ──
  artifact: { server: local, graph: brain, query: get_artifact, args: [slug], format: kv }
  artifacts-by-thread: { server: local, graph: brain, query: artifacts_by_thread, args: [thread_id] }
  artifact-people: { server: local, graph: brain, query: artifact_mentions, args: [slug] }
  artifact-derived-from: { server: local, graph: brain, query: artifact_derived_from, args: [slug] }

  # ── Mutations: node creation ──
  add-person: { server: local, graph: brain, query: add_person, args: [slug, name, relation, createdAt, updatedAt] }
  add-event: { server: local, graph: brain, query: add_event, args: [slug, name, kind, when, createdAt, updatedAt] }
  add-place: { server: local, graph: brain, query: add_place, args: [slug, name, kind, createdAt, updatedAt] }
  add-organization: { server: local, graph: brain, query: add_organization, args: [slug, name, kind, createdAt, updatedAt] }
  add-note: { server: local, graph: brain, query: add_note, args: [slug, name, kind, createdAt, updatedAt] }
  add-task: { server: local, graph: brain, query: add_task, args: [slug, name, status, createdAt, updatedAt] }
  add-project: { server: local, graph: brain, query: add_project, args: [slug, name, kind, status, createdAt, updatedAt] }
  add-area: { server: local, graph: brain, query: add_area, args: [slug, name, kind, status, createdAt, updatedAt] }
  add-goal: { server: local, graph: brain, query: add_goal, args: [slug, name, status, createdAt, updatedAt] }
  add-habit: { server: local, graph: brain, query: add_habit, args: [slug, name, status, frequency, createdAt, updatedAt] }
  add-media: { server: local, graph: brain, query: add_media, args: [slug, name, kind, createdAt, updatedAt] }
  add-artifact: { server: local, graph: brain, query: add_artifact, args: [slug, name, kind, source, timestamp, createdAt, updatedAt] }

  # ── Mutations: edges ──
  link-knows: { server: local, graph: brain, query: link_knows, args: [from, to] }
  link-related: { server: local, graph: brain, query: link_related, args: [from, to, relation] }
  link-lives-in: { server: local, graph: brain, query: link_lives_in, args: [from, to] }
  link-works-at: { server: local, graph: brain, query: link_works_at, args: [from, to] }
  link-attended-by: { server: local, graph: brain, query: link_attended_by, args: [event, person] }
  link-event-for-person: { server: local, graph: brain, query: link_event_for_person, args: [event, person] }
  link-event-for-project: { server: local, graph: brain, query: link_event_for_project, args: [event, project] }
  link-happened-at: { server: local, graph: brain, query: link_happened_at, args: [event, place] }
  link-note-about-person: { server: local, graph: brain, query: link_note_about_person, args: [note, person] }
  link-note-about-project: { server: local, graph: brain, query: link_note_about_project, args: [note, project] }
  link-note-from-artifact: { server: local, graph: brain, query: link_note_from_artifact, args: [note, artifact] }
  link-related-note: { server: local, graph: brain, query: link_related_note, args: [from, to] }
  link-task-for-person: { server: local, graph: brain, query: link_task_for_person, args: [task, person] }
  link-task-for-project: { server: local, graph: brain, query: link_task_for_project, args: [task, project] }
  link-task-for-area: { server: local, graph: brain, query: link_task_for_area, args: [task, area] }
  link-task-for-goal: { server: local, graph: brain, query: link_task_for_goal, args: [task, goal] }
  link-project-in-area: { server: local, graph: brain, query: link_project_in_area, args: [project, area] }
  link-goal-for-area: { server: local, graph: brain, query: link_goal_for_area, args: [goal, area] }
  link-habit-for-area: { server: local, graph: brain, query: link_habit_for_area, args: [habit, area] }
  link-habit-from-principle: { server: local, graph: brain, query: link_habit_from_principle, args: [habit, note] }
  link-media-authored-by: { server: local, graph: brain, query: link_media_authored_by, args: [media, person] }
  link-media-recommended-by: { server: local, graph: brain, query: link_media_recommended_by, args: [media, person] }
  link-mentions-person: { server: local, graph: brain, query: link_mentions_person, args: [artifact, person] }
  link-artifact-from-person: { server: local, graph: brain, query: link_artifact_from_person, args: [artifact, person] }
  link-record-of: { server: local, graph: brain, query: link_record_of, args: [artifact, event] }
  link-derived-from: { server: local, graph: brain, query: link_derived_from, args: [from, to, activity, createdAt] }
